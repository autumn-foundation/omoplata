[package]
name = "omoplata-cli"
version.workspace = true
description = "omo, the command-line interface for the omoplata version control system"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "omo"
path = "src/main.rs"

[features]
# Default: deterministic offline embeddings only (no model, no network).
default = []
# Opt-in real transformer embeddings for `omo dup`/`omo similar --real-embeddings`.
# Fetches the model + ONNX Runtime on first use. See ADR-0006.
fastembed = ["omoplata-sem/fastembed"]

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
omoplata-store = { workspace = true }
omoplata-algebra = { workspace = true }
omoplata-drivers = { workspace = true }
omoplata-git = { workspace = true }
omoplata-identity = { workspace = true }
omoplata-sem = { workspace = true }
omoplata-work = { workspace = true }
tempfile = "3"
serde = { workspace = true }
serde_json = { workspace = true }


[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# Used by the concurrency stress test to load and assert on the op log written
# by the spawned `omo` child processes.
omoplata-store = { workspace = true }
omoplata-work = { workspace = true }
